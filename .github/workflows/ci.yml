name: CI

on:
  push:
    branches:
      - staging
      - main

  pull_request:
    branches:
      - staging
      - main
      
# Default permission dibuat minimal
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:

  # ============================================================
  # TEST
  # ============================================================
  test:
    name: Test Application
    runs-on: self-hosted
    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4
      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .
      # ----------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------
      - name: Install dependencies
        working-directory: .
        run: |
          npm ci
      # ----------------------------------------------------------
      # Unit / Application test
      # ----------------------------------------------------------
      - name: Run tests
        working-directory: .
        run: |
          npm test --if-present

  # ============================================================
  # DEPENDENCY SECURITY
  # ============================================================
  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
     #backend
      - name: Install dependencies
        working-directory: .
        run: |
          npm ci
      # ----------------------------------------------------------
      # Check vulnerable npm dependencies
      # ----------------------------------------------------------
      - name: Run npm audit
        working-directory: .
        run: |
          npm audit --audit-level=high
# ===========================================================
  # DOCKER BUILD
  # ============================================================
  docker-build:
    name: Build Docker Image
    needs:
      - test
    # Build image hanya pada push.
    # Pull request hanya melakukan validation/security.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4
      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      # ----------------------------------------------------------
      # Dockerfile Lint
      # ----------------------------------------------------------
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      # ----------------------------------------------------------
      # Build Docker Image
      # ----------------------------------------------------------
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
             ${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # ==========================================================
      # LOGIN GHCR
      # ==========================================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ==========================================================
      # PUSH EXISTING IMAGE
      # ==========================================================
      - name: Push Docker Image
        run: |
          docker tag \
            ${{ github.event.repository.name }}:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}